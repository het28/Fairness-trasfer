# Adapted Steck-style post-learning anchor (catalog-share T).
# Derived from research runner constants — do not invent values.
method: steck_catalog
models: [lightgcn, ngcf]
datasets: [ml1m, lastfm]
seeds: [0, 1, 2]
lambdas: [0.0, 0.1, 0.25, 0.5, 0.75, 0.9, 1.0]
candidate_multiplier: 10   # C = 10 * K = 100
k: 10
utility_budgets: [0.01, 0.025, 0.05, 0.10]
eps_smoothing: 0.01
