[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fairness-transfer-exposure"
version = "0.1.0"
description = "Anonymous artifact: input-to-output exposure realization in recommender systems"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21",
  "scipy>=1.7",
  "pandas>=1.3",
  "pyyaml>=6.0",
  "torch>=2.0",
  "recbole>=1.2.0",
  "matplotlib>=3.5",
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
